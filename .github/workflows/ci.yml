name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # tests run on the seed, whatever the live Ops feed holds today
      OPS_EVENTS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generated files are current
        run: pnpm gen && git diff --exit-code

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The release build: no dev kit.
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E against the build (real WebKit for phones and tablets)
        run: pnpm e2e:all

      - name: JS budget for /menu (plan Q3)
        run: |
          pnpm start -p 3200 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200/menu > /dev/null && break; sleep 1; done
          pnpm budget http://localhost:3200

      - name: Lighthouse budgets
        run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
